<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Bus body -->
  <rect x="100" y="150" width="600" height="150" rx="20" ry="20" fill="#3498db" stroke="#333" stroke-width="5"/>
  
  <!-- Windows -->
  <rect x="150" y="170" width="70" height="60" rx="5" ry="5" fill="#d5f5ff" stroke="#333" stroke-width="2"/>
  <rect x="240" y="170" width="70" height="60" rx="5" ry="5" fill="#d5f5ff" stroke="#333" stroke-width="2"/>
  <rect x="330" y="170" width="70" height="60" rx="5" ry="5" fill="#d5f5ff" stroke="#333" stroke-width="2"/>
  <rect x="420" y="170" width="70" height="60" rx="5" ry="5" fill="#d5f5ff" stroke="#333" stroke-width="2"/>
  <rect x="510" y="170" width="70" height="60" rx="5" ry="5" fill="#d5f5ff" stroke="#333" stroke-width="2"/>
  
  <!-- Door -->
  <rect x="600" y="180" width="40" height="120" rx="5" ry="5" fill="#d5f5ff" stroke="#333" stroke-width="3"/>
  <line x1="620" y1="180" x2="620" y2="300" stroke="#333" stroke-width="2"/>
  
  <!-- Wheels -->
  <circle cx="200" cy="320" r="40" fill="#333" stroke="#222" stroke-width="5"/>
  <circle cx="200" cy="320" r="20" fill="#666" stroke="#222" stroke-width="2"/>
  <circle cx="540" cy="320" r="40" fill="#333" stroke="#222" stroke-width="5"/>
  <circle cx="540" cy="320" r="20" fill="#666" stroke="#222" stroke-width="2"/>
  
  <!-- Headlights -->
  <circle cx="105" cy="200" r="15" fill="#ffdd00" stroke="#333" stroke-width="2"/>
  <circle cx="105" cy="250" r="15" fill="#ffdd00" stroke="#333" stroke-width="2"/>
  
  <!-- Text -->
  <text x="330" y="245" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">HR1002</text>
  
  <!-- Maintenance Indicator -->
  <g transform="translate(650, 170) scale(0.7)">
    <circle cx="0" cy="0" r="30" fill="#ff9900" stroke="#333" stroke-width="2"/>
    <path d="M-15,-15 L15,15 M-15,15 L15,-15" stroke="#333" stroke-width="5"/>
  </g>
  
  <!-- Haryana Roadways Logo -->
  <circle cx="330" cy="120" r="40" fill="white" stroke="#333" stroke-width="2"/>
  <text x="330" y="130" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Haryana</text>
  <text x="330" y="150" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Roadways</text>
</svg>